<!doctype html>
<html lang="ru" data-theme-pending>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e100f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <title>Bizdin Auyl</title>
    <script>
      // Тема ставится до первой отрисовки: страница не мигает чужой темой.
      (function () {
        try {
          var saved = localStorage.getItem('ba.theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
