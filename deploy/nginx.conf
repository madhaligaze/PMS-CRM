# Веб и API на одном адресе: refresh-cookie остаётся SameSite=Strict, CORS не нужен.
upstream bizdin_api {
  server api:4000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Скан документа и фото поломки - до 15 МБ.
  client_max_body_size 16m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # Поток событий (SSE): без буферизации и с долгим ожиданием.
  location ~ ^/api/v1/properties/[^/]+/events$ {
    proxy_pass http://bizdin_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://bizdin_api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Файлы сборки с хешем в имени - навсегда в кэш браузера.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Приложение одностраничное: любой путь отдаёт index.html, сам index - без кэша.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
